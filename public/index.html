<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>公開テスト</title>
<style>
  :root { --bg:#f6f7fb; --fg:#1b1f2a; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --fg:#e8ebf2; --accent:#6c9bff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg);
         font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { line-height:1.7; margin:.25rem 0; }
  button { margin-top:1rem; padding:.8rem 1.4rem; font-size:1rem; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  #time { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>公開テスト成功 🎉</h1>
  <p>このページはClaude Codeからスマホ操作で自動公開されました。</p>
  <p id="time">--</p>
  <button id="btn" type="button">時刻を更新</button>
</main>
<script>
  const t = document.getElementById('time');
  const update = () => { t.textContent = new Date().toLocaleString('ja-JP'); };
  document.getElementById('btn').addEventListener('click', update);
  update();
</script>
</body>
</html>
