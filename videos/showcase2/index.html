<!doctype html>
<html lang="ja">

<meta charset="utf-8">
<title>showcase2</title>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio.js"></script>
<script>
// 全フレームを計算で描く。renderFrame(f) を外から1枚ずつ呼んで撮影する。
const W = 1080, H = 1920, FPS = 30, TOTAL = 1440;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SANS = '"Noto Sans CJK JP",sans-serif', MONO = '"Noto Sans Mono CJK JP",monospace';
const A = window.AUDIO;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
function rng32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function txt(s, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 700} ${size}px ${o.font || SANS}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 30; }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
const bc = document.createElement('canvas'); bc.width = 270; bc.height = 480;
const bctx = bc.getContext('2d');
function bloom(strength = .8, blur = 14) {
  bctx.clearRect(0, 0, 270, 480); bctx.drawImage(cv, 0, 0, 270, 480);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = `blur(${blur}px)`;
  ctx.globalAlpha = strength; ctx.drawImage(bc, 0, 0, W, H); ctx.restore();
}
// フィルムの粒子感
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 512;
{ const g = grainC.getContext('2d'), im = g.createImageData(512, 512), r = rng32(5); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }
function grain(f, a = .07) {
  const r = rng32(f * 7 + 1), ox = Math.floor(r() * 512), oy = Math.floor(r() * 512);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = a;
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) ctx.drawImage(grainC, x, y);
  ctx.restore();
}
function caption(title, sub, t, dur, size = 92) {
  const a = ease(t / .6) * (1 - ease((t - dur + .5) / .5));
  const g = ctx.createLinearGradient(0, 1280, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.82)');
  ctx.fillStyle = g; ctx.fillRect(0, 1280, W, 640);
  const y = 1560 + (1 - easeOut(t / .7)) * 40;
  txt(title, W / 2, y, size, '#fff', { alpha: a, weight: 900, glow: 'rgba(0,0,0,.9)', blur: 24 });
  txt(sub, W / 2, y + 98, 35, '#dfe5ff', { alpha: a, weight: 500, glow: 'rgba(0,0,0,.9)', blur: 12 });
}

// ================= WebGL =================
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const NOISE = `
precision highp float;
uniform vec2 R; uniform float T;
float hash(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
const mat2 M2=mat2(.8,-.6,.6,.8);
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
`;
// ---- 風景: 山・海・空を数式だけで描く ----
const FS_LAND = NOISE + `
vec3 SUN;
float path(float z){ return sin(z*.17)*1.3 + sin(z*.07)*.8; }
float terrL(vec2 p){
  float w=smoothstep(.35,3.2,abs(p.x-path(p.y)));
  vec2 q=p*.32; float h=0., a=.5;
  for(int i=0;i<4;i++){ h+=a*noise(q); q=M2*q*2.03; a*=.5; }
  return mix(-.35, h*h*5.2-.15, w);
}
float terrH(vec2 p){
  float w=smoothstep(.35,3.2,abs(p.x-path(p.y)));
  vec2 q=p*.32; float h=0., a=.5;
  for(int i=0;i<8;i++){ h+=a*noise(q); q=M2*q*2.03; a*=.5; }
  return mix(-.35, h*h*5.2-.15, w);
}
float fbm5(vec2 q){ float h=0., a=.5; for(int i=0;i<5;i++){ h+=a*noise(q); q=M2*q*2.03; a*=.5; } return h; }
float wave(vec2 q){ q+=T*vec2(.25,.45); return noise(q)*.6 + noise(M2*q*2.1 - T*.3)*.3 + noise(q*4.3 + T*.5)*.1; }
float march(vec3 ro, vec3 rd, float tmax){
  float t=.05;
  for(int i=0;i<70;i++){ vec3 p=ro+rd*t; float d=p.y-terrL(p.xz); if(d<.002*t) return t; t+=d*.5; if(t>tmax) break; }
  return -1.;
}
float marchR(vec3 ro, vec3 rd){
  float t=.1;
  for(int i=0;i<30;i++){ vec3 p=ro+rd*t; float d=p.y-terrL(p.xz); if(d<.004*t) return t; t+=d*.7; if(t>25.) break; }
  return -1.;
}
vec3 sky(vec3 rd){
  float sd=max(dot(rd,SUN),0.), y=max(rd.y,0.);
  vec3 c=mix(vec3(.95,.42,.16), vec3(.16,.22,.46), pow(y,.5));
  c=mix(c, vec3(.02,.04,.14), smoothstep(.15,1.1,y));
  c+=vec3(1.,.5,.2)*pow(sd,5.)*.35 + vec3(1.,.8,.5)*pow(sd,50.)*.6 + vec3(1.,.95,.85)*smoothstep(.9993,.9998,sd)*6.;

    vec2 q=rd.xz/(rd.y+.08)*1.1 + vec2(0.,T*.05);
    float cl=smoothstep(.5,.82,fbm5(q));
    vec3 cc=mix(vec3(1.,.48,.28), vec3(.42,.36,.5), clamp(y*1.5,0.,1.))*(.55+.9*pow(sd,4.));
    c=mix(c, cc, cl*.85*smoothstep(0.,.14,rd.y));
  }

}
vec3 fog(vec3 col, float t, vec3 rd){
  vec3 fc=mix(vec3(.2,.24,.4), vec3(.95,.5,.24), pow(max(dot(rd,SUN),0.),4.));
  return mix(col, fc, 1.-exp(-t*.032));
}
vec3 shade(vec3 p, float t){
  float e=.012+.002*t;
  vec3 n=normalize(vec3(terrH(p.xz-vec2(e,0.))-terrH(p.xz+vec2(e,0.)), 2.*e, terrH(p.xz-vec2(0.,e))-terrH(p.xz+vec2(0.,e))));
  float ndl=max(dot(n,SUN),0.), sh=1., st=.1;
  for(int i=0;i<10;i++){ vec3 q=p+SUN*st; float d=q.y-terrL(q.xz); sh=min(sh,8.*d/st); st+=max(.15,d); }
  sh=clamp(sh,0.,1.);
  vec3 rock=mix(vec3(.17,.14,.12), vec3(.32,.27,.23), noise(p.xz*6.));
  vec3 alb=mix(vec3(.08,.14,.05), rock, clamp(smoothstep(.25,.9,p.y)+1.-smoothstep(.6,.85,n.y),0.,1.));
  float snow=smoothstep(1.2,1.8,p.y+.4*noise(p.xz*3.))*smoothstep(.5,.75,n.y);
  alb=mix(alb, vec3(.85,.88,.95), snow);
  return alb*(vec3(1.,.55,.28)*3.*ndl*sh + vec3(.12,.18,.3)*(.5+.5*n.y) + vec3(.2,.1,.05)*max(dot(n,normalize(-SUN*vec3(1.,0.,1.))),0.));
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.-R)/R.x;
  float z=T*1.5;
  SUN=normalize(vec3(.2,.05+.02*T,1.));
  vec3 ro=vec3(path(z), .55+.1*sin(T*.5), z);
  vec3 ta=vec3(path(z+3.), .6, z+3.);
  vec3 f=normalize(ta-ro), r=normalize(cross(vec3(0.,1.,0.),f)), u=cross(f,r);
  vec3 rd=normalize(uv.x*r + (uv.y+.3)*u + 1.5*f);
  float tw=rd.y<0. ? -ro.y/rd.y : 1e5;
  float t=march(ro,rd,min(tw,45.));
  vec3 col;
  if(t>0.){ col=fog(shade(ro+rd*t,t),t,rd); }
  else if(tw<1e4){
    vec3 p=ro+rd*tw; vec2 wq=p.xz*3.; float e=.03, att=.06/(1.+tw*.12);
    float n0=wave(wq), nx=wave(wq+vec2(e,0.)), nz=wave(wq+vec2(0.,e));
    vec3 n=normalize(vec3(-(nx-n0)/e*att, 1., -(nz-n0)/e*att));
    vec3 rr=reflect(rd,n); rr.y=abs(rr.y);
    float fr=.03+.97*pow(1.-max(dot(-rd,n),0.),5.);
    vec3 refl=sky(rr);
    float tr=marchR(p+vec3(0.,.01,0.),rr);
    if(tr>0.) refl=fog(shade(p+rr*tr,tr)*.8,tr,rr);
    col=mix(vec3(.01,.06,.09), refl, fr*.9+.1);
    col=fog(col,tw,rd);
  } else col=sky(rd);
  col=aces(col*.95); col=pow(col,vec3(1./2.2));
  col*=1.-.13*dot(uv*.55,uv*.55);
  gl_FragColor=vec4(col,1.);
}`;
// ---- レイトレーシング: 反射・屈折・影 ----
const FS_RAY = NOISE + `
uniform vec4 S[7]; uniform vec3 C[7];
const vec3 L=vec3(.5145,.7203,-.4651);
vec3 env(vec3 rd){
  float y=rd.y;
  vec3 c=mix(vec3(.2,.07,.17), vec3(.03,.04,.13), pow(max(y,0.),.45));
  c=mix(c, vec3(.01,.01,.05), smoothstep(.25,.9,y));
  float sd=max(dot(rd,L),0.);
  c+=vec3(1.,.9,.75)*(pow(sd,220.)*.7+pow(sd,900.)*26.);
  c+=vec3(.55,.8,1.)*smoothstep(.955,.965,dot(rd,normalize(vec3(-.7,.5,.3))))*3.5;
  return c;
}
float hit(vec3 ro, vec3 rd, out vec3 n, out int id, out vec4 sp, out vec3 cl){
  float t=1e5; id=-2;
  if(rd.y<0.){ float tp=-ro.y/rd.y; if(tp>.001){ t=tp; n=vec3(0.,1.,0.); id=-1; } }
  for(int i=0;i<7;i++){
    vec3 oc=ro-S[i].xyz; float b=dot(oc,rd), c=dot(oc,oc)-S[i].w*S[i].w, h=b*b-c;
    if(h>0.){ float ts=-b-sqrt(h); if(ts>.001 && ts<t){ t=ts; n=(oc+rd*ts)/S[i].w; id=i; sp=S[i]; cl=C[i]; } }
  }
  return t;
}
float shadow(vec3 p){
  float s=1.;
  for(int i=0;i<7;i++){
    vec3 oc=p-S[i].xyz; float b=dot(oc,L), c=dot(oc,oc)-S[i].w*S[i].w, h=b*b-c;
    float d=-S[i].w+sqrt(max(0.,S[i].w*S[i].w-h)), t=-b-sqrt(max(0.,h));
    float v=(t<0.)?1.:smoothstep(0.,1.,5.*d/t);
    s=min(s, i==0 ? mix(.55,1.,v) : v);
  }
  return s;
}
vec3 trace(vec3 ro, vec3 rd){
  vec3 col=vec3(0.), thr=vec3(1.);
  for(int b=0;b<6;b++){
    vec3 n, cl; int id; vec4 sp;
    float t=hit(ro,rd,n,id,sp,cl);
    if(id==-2){ col+=thr*env(rd); break; }
    vec3 p=ro+rd*t;
    float fr=.04+.96*pow(1.-max(dot(-rd,n),0.),5.);
    if(id==-1){
      vec2 q=floor(p.xz*.7); float ch=mod(q.x+q.y,2.);
      vec3 alb=mix(vec3(.03,.03,.05), vec3(.42,.42,.5), ch);
      float sh=shadow(p+n*.002);
      vec3 d=alb*(vec3(1.,.92,.8)*2.2*max(dot(n,L),0.)*sh + vec3(.12,.14,.25));
      float fo=1.-exp(-t*.035);
      col+=thr*mix((1.-fr)*d, env(vec3(rd.x,.02,rd.z)), fo);
      thr*=(fr+.1)*(1.-fo); ro=p+n*.002; rd=reflect(rd,n);
    } else if(id==0){
      col+=thr*fr*env(reflect(rd,n));
      vec3 r1=refract(rd,n,1./1.5);
      vec3 p2=p+r1*(-2.*dot(p-sp.xyz,r1)), n2=(p2-sp.xyz)/sp.w;
      vec3 r2=refract(r1,-n2,1.5); if(dot(r2,r2)<.01) r2=reflect(r1,-n2);
      thr*=(1.-fr)*vec3(.9,.97,1.); ro=p2+r2*.003; rd=r2;
    } else if(id==1||id==3||id==5){
      thr*=cl; ro=p+n*.002; rd=reflect(rd,n);
    } else {
      float sh=shadow(p+n*.002);
      col+=thr*(1.-fr)*cl*(vec3(1.,.92,.8)*2.2*max(dot(n,L),0.)*sh + vec3(.1,.12,.22));
      thr*=fr; ro=p+n*.002; rd=reflect(rd,n);
    }
  }
  return col;
}
void main(){
  vec3 tot=vec3(0.);
  float a=T*.22+.6;
  vec3 ro=vec3(sin(a)*6.4, 4.4+.5*sin(T*.4), cos(a)*6.4), ta=vec3(0.,.9,0.);
  vec3 f=normalize(ta-ro), r=normalize(cross(vec3(0.,1.,0.),f)), u=cross(f,r);
  for(int j=0;j<4;j++){
    vec2 o=vec2(mod(float(j),2.), floor(float(j)/2.))*.5-.25;
    vec2 uv=((gl_FragCoord.xy+o)*2.-R)/R.x;
    vec3 rd=normalize(uv.x*r + (uv.y+.2)*u + 1.75*f);
    tot+=trace(ro,rd);
  }
  vec3 col=aces(tot/4.); col=pow(col,vec3(1./2.2));
  vec2 v=(gl_FragCoord.xy*2.-R)/R.x; col*=1.-.1*dot(v*.55,v*.55);
  gl_FragColor=vec4(col,1.);
}`;
function mkProg(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const P_LAND = mkProg(FS_LAND), P_RAY = mkProg(FS_RAY);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function runShader(p, w, h, t, extra) {
  if (glc.width !== w) { glc.width = w; glc.height = h; }
  gl.viewport(0, 0, w, h); gl.useProgram(p);
  gl.uniform2f(gl.getUniformLocation(p, 'R'), w, h); gl.uniform1f(gl.getUniformLocation(p, 'T'), t);
  if (extra) extra(p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(glc, 0, 0, W, H);
}
const SPH_COL = [[1, 1, 1], [1, .78, .4], [.9, .12, .15], [.92, .92, .95], [.08, .6, .62], [1, .6, .65], [.95, .7, .1]];
function sceneRay(t) {
  runShader(P_RAY, 720, 1280, t, p => {
    const S = [0, 1.25, 0, 1.25];
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + t * .45, r = .55 + .12 * (i % 2);
      const ph = ((t * 2 + i * .5) % 1 + 1) % 1, y = r + 3.4 * ph * (1 - ph); // 拍に合わせて弾む放物運動
      S.push(Math.cos(a) * 2.9, y, Math.sin(a) * 2.9, r);
    }
    gl.uniform4fv(gl.getUniformLocation(p, 'S'), new Float32Array(S));
    gl.uniform3fv(gl.getUniformLocation(p, 'C'), new Float32Array(SPH_COL.flat()));
  });
}

// ================= 流体シミュレーション =================
const FW = 144, FH = 256, DW = 288, DH = 512;
const F = { u: new Float32Array(FW * FH), v: new Float32Array(FW * FH), u0: new Float32Array(FW * FH), v0: new Float32Array(FW * FH), p: new Float32Array(FW * FH), p0: new Float32Array(FW * FH), div: new Float32Array(FW * FH), cur: new Float32Array(FW * FH),
  d: [0, 1, 2].map(() => new Float32Array(DW * DH)), d0: [0, 1, 2].map(() => new Float32Array(DW * DH)), last: -2 };
const fcv = document.createElement('canvas'); fcv.width = DW; fcv.height = DH;
const fctx = fcv.getContext('2d'), fimg = fctx.createImageData(DW, DH);
function splat(x, y, fx, fy, rgb, rad) {
  const r2 = rad * rad, R = Math.ceil(rad * 2.5);
  for (let j = Math.max(1, Math.floor(y - R)); j <= Math.min(FH - 2, Math.ceil(y + R)); j++) for (let i = Math.max(1, Math.floor(x - R)); i <= Math.min(FW - 2, Math.ceil(x + R)); i++) {
    const w = Math.exp(-((i - x) ** 2 + (j - y) ** 2) / r2); F.u[j * FW + i] += fx * w; F.v[j * FW + i] += fy * w;
  }
  const X = x * 2, Y = y * 2, rd = rad * 2, rd2 = rd * rd, RD = Math.ceil(rd * 2.5);
  for (let j = Math.max(0, Math.floor(Y - RD)); j <= Math.min(DH - 1, Math.ceil(Y + RD)); j++) for (let i = Math.max(0, Math.floor(X - RD)); i <= Math.min(DW - 1, Math.ceil(X + RD)); i++) {
    const w = Math.exp(-((i - X) ** 2 + (j - Y) ** 2) / rd2), k = j * DW + i; F.d[0][k] += rgb[0] * w; F.d[1][k] += rgb[1] * w; F.d[2][k] += rgb[2] * w;

function bil(a, w, h, x, y) {

  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, k = j * w + i;

function fluidInit() {
  for (const a of [F.u, F.v, F.p, F.d[0], F.d[1], F.d[2]]) a.fill(0);
  for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; splat(72 + Math.cos(a) * 14, 120 + Math.sin(a) * 14, Math.cos(a) * 9, Math.sin(a) * 9, hsl(i * 26, 1, .55).map(v => v * 1.6), 5); }

function fluidStep(f) {

  splat(72 + Math.sin(t * 1.3) * 30, 238, Math.sin(t * 2.1) * .5, -1.5, hsl(t * 50, 1, .55).map(v => v * .55), 5);
  splat(72 + Math.cos(t * .9) * 30, 16, Math.cos(t * 1.7) * .5, 1.2, hsl(t * 50 + 180, 1, .55).map(v => v * .4), 5);

  const { u, v, u0, v0, p, p0, div, cur } = F;
  // 渦を保つ補正
  for (let j = 1; j < FH - 1; j++) for (let i = 1; i < FW - 1; i++) { const k = j * FW + i; cur[k] = (v[k + 1] - v[k - 1] - u[k + FW] + u[k - FW]) * .5; }
  for (let j = 2; j < FH - 2; j++) for (let i = 2; i < FW - 2; i++) {
    const k = j * FW + i, gx = (Math.abs(cur[k + 1]) - Math.abs(cur[k - 1])) * .5, gy = (Math.abs(cur[k + FW]) - Math.abs(cur[k - FW])) * .5, l = Math.hypot(gx, gy) + 1e-5;

  for (let j = 1; j < FH - 1; j++) for (let i = 1; i < FW - 1; i++) { const k = j * FW + i, x = i - u0[k], y = j - v0[k]; u[k] = bil(u0, FW, FH, x, y) * .999; v[k] = bil(v0, FW, FH, x, y) * .999; }
  // 圧力を解いて、湧き出しのない流れにする(ヤコビ反復)
  for (let j = 1; j < FH - 1; j++) for (let i = 1; i < FW - 1; i++) { const k = j * FW + i; div[k] = (u[k + 1] - u[k - 1] + v[k + FW] - v[k - FW]) * .5; }
  let a = p, bq = p0;
  for (let it = 0; it < 30; it++) { for (let j = 1; j < FH - 1; j++) for (let i = 1; i < FW - 1; i++) { const k = j * FW + i; bq[k] = (a[k - 1] + a[k + 1] + a[k - FW] + a[k + FW] - div[k]) * .25; } [a, bq] = [bq, a]; }
  if (a !== p) p.set(a);
  for (let j = 1; j < FH - 1; j++) for (let i = 1; i < FW - 1; i++) { const k = j * FW + i; u[k] -= (p[k + 1] - p[k - 1]) * .5; v[k] -= (p[k + FW] - p[k - FW]) * .5; }
  for (let i = 0; i < FW; i++) { u[i] = v[i] = 0; u[(FH - 1) * FW + i] = v[(FH - 1) * FW + i] = 0; }
  for (let j = 0; j < FH; j++) { u[j * FW] = v[j * FW] = 0; u[j * FW + FW - 1] = v[j * FW + FW - 1] = 0; }
  // 色(インク)を運ぶ
  for (let c = 0; c < 3; c++) {
    const d = F.d[c], d0 = F.d0[c]; d0.set(d);
    for (let j = 0; j < DH; j++) for (let i = 0; i < DW; i++) {
      const gx = i * .5, gy = j * .5, ux = bil(u, FW, FH, gx, gy), vy = bil(v, FW, FH, gx, gy);
      d[j * DW + i] = bil(d0, DW, DH, i - ux * 2, j - vy * 2) * .993;
    }
  }
}
function sceneFluid(sf, t, k) {
  if (F.last !== sf - 1) { fluidInit(); for (let i = 0; i < sf; i++) fluidStep(i); }
  fluidStep(sf); F.last = sf;
  const px = fimg.data, [r, g, b] = F.d;
  for (let i = 0; i < DW * DH; i++) { px[i * 4] = 6 + 249 * (1 - Math.exp(-r[i] * 1.5)); px[i * 4 + 1] = 7 + 248 * (1 - Math.exp(-g[i] * 1.5)); px[i * 4 + 2] = 16 + 239 * (1 - Math.exp(-b[i] * 1.5)); px[i * 4 + 3] = 255; }
  fctx.putImageData(fimg, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(fcv, 0, 0, W, H);
  bloom(.45 + .25 * k, 18);
}

// ================= 点群(銀河 → DNA → 球 → 文字) =================
const NP = 60000;
const SH = {}, pDelay = new Float32Array(NP), pBucket = new Uint8Array(NP);
function buildShapes() {
  const r = rng32(2024), gauss = () => (r() + r() + r() + r() - 2) * .87;
  const mk = () => new Float32Array(NP * 3);
  const sc = SH.scatter = mk(), ga = SH.galaxy = mk(), he = SH.helix = mk(), sp = SH.sphere = mk(), tx = SH.text = mk();
  // ロゴ文字の点
  const oc = document.createElement('canvas'); oc.width = W; oc.height = 700; const o = oc.getContext('2d');
  o.font = `900 225px ${SANS}`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  o.fillText('Claude', W / 2, 225); o.fillText('Code', W / 2, 475);
  const d = o.getImageData(0, 0, W, 700).data, pts = [];
  for (let y = 0; y < 700; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x - W / 2, y - 350]);
  for (let i = 0; i < NP; i++) {
    const j = i * 3; pDelay[i] = r(); pBucket[i] = Math.floor(r() * 12);
    let a = r() * 6.283, b = Math.acos(2 * r() - 1), rr = 900 + r() * 900;
    sc[j] = rr * Math.sin(b) * Math.cos(a); sc[j + 1] = rr * Math.cos(b); sc[j + 2] = rr * Math.sin(b) * Math.sin(a);
    if (i % 6 === 0) { ga[j] = gauss() * 55; ga[j + 1] = gauss() * 40; ga[j + 2] = gauss() * 55; }
    else { rr = 40 + Math.pow(r(), .7) * 480; a = (i % 3) * 2.094 + rr * .011 + gauss() * (.38 - rr * .0003); ga[j] = Math.cos(a) * rr; ga[j + 1] = gauss() * 26 * Math.exp(-rr / 350); ga[j + 2] = Math.sin(a) * rr; }
    const u = r();
    if (i % 3 === 0) { const q = Math.floor(u * 44) / 44, an = q * 6.283 * 4.5, m = r() * 2 - 1; he[j] = Math.cos(an) * 170 * m; he[j + 1] = (q - .5) * 1380; he[j + 2] = Math.sin(an) * 170 * m; }
    else { const an = u * 6.283 * 4.5 + (i % 2) * Math.PI; he[j] = Math.cos(an) * 170 + gauss() * 9; he[j + 1] = (u - .5) * 1380 + gauss() * 9; he[j + 2] = Math.sin(an) * 170 + gauss() * 9; }
    let lat, lon;
    if (i % 2 === 0) { lat = Math.asin(2 * r() - 1); lon = r() * 6.283; }
    else if (i % 4 === 1) { lon = Math.floor(r() * 16) / 16 * 6.283; lat = (r() - .5) * Math.PI; }
    else { lat = (Math.floor(r() * 9) + 1) / 10 * Math.PI - Math.PI / 2; lon = r() * 6.283; }
    sp[j] = 370 * Math.cos(lat) * Math.cos(lon); sp[j + 1] = 370 * Math.sin(lat); sp[j + 2] = 370 * Math.cos(lat) * Math.sin(lon);
    const pt = pts[Math.floor(r() * pts.length)];
    tx[j] = pt[0] + r() * 2; tx[j + 1] = pt[1] + r() * 2; tx[j + 2] = (r() - .5) * 34;
  }
}
function drawCloud(from, to, m, rotY, rotX, cx, cy, hue0, sat = 95) {
  if (!SH.galaxy) buildShapes();
  const Aa = SH[from], Bb = SH[to], cy_ = Math.cos(rotY), sy = Math.sin(rotY), cxr = Math.cos(rotX), sxr = Math.sin(rotX);
  const NB = 12, paths = Array.from({ length: NB * 2 }, () => new Path2D());
  for (let i = 0; i < NP; i++) {
    const j = i * 3, mi = ease(m * 1.5 - pDelay[i] * .5);
    const x = Aa[j] + (Bb[j] - Aa[j]) * mi, y = Aa[j + 1] + (Bb[j + 1] - Aa[j + 1]) * mi, z = Aa[j + 2] + (Bb[j + 2] - Aa[j + 2]) * mi;
    const x1 = x * cy_ + z * sy, z1 = -x * sy + z * cy_, y2 = y * cxr - z1 * sxr, z2 = y * sxr + z1 * cxr;
    const s = 1500 / (1500 + z2); if (s <= 0 || s > 6) continue;
    const near = z2 < 0 ? 1 : 0, sz = near ? 3 : 2;
    paths[pBucket[i] + near * NB].rect(cx + x1 * s - sz / 2, cy + y2 * s - sz / 2, sz, sz);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let b = 0; b < NB * 2; b++) { ctx.fillStyle = `hsla(${(hue0 + (b % NB) * 11) % 360},${sat}%,${b < NB ? 52 : 66}%,${b < NB ? .45 : .7})`; ctx.fill(paths[b]); }
  ctx.restore();
}
function space(k, cy = 800) {
  ctx.fillStyle = '#03040a'; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, 1000);
  rg.addColorStop(0, `rgba(70,45,150,${.25 + .2 * k})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
}
function sceneGalaxy(u, k) {
  space(k);
  const rotY = u * .55, hue = 205 + u * 12;
  if (u < 2.8) drawCloud('scatter', 'galaxy', u / 1.3, rotY, 1.05, W / 2, 800, hue);
  else if (u < 5.4) drawCloud('galaxy', 'helix', (u - 2.8) / 1.1, rotY, 1.05 * (1 - ease((u - 2.8) / 1.1)) + .12, W / 2, 800, hue);
  else drawCloud('helix', 'sphere', (u - 5.4) / 1.1, rotY, .12 + .2 * ease((u - 5.4) / 1.1), W / 2, 800, hue);
  bloom(.9, 14);
}

// ================= 場面 =================
function sceneIntro(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const words = [['カメラなし。', .5], ['素材なし。', 1.5], ['予算ゼロ。', 2.5]];
  const out = 1 - ease((t - 3.05) / .25);
  words.forEach(([s, st], i) => {
    if (t < st) return;
    const e = easeOut((t - st) / .22), sc = 2.4 - 1.4 * e;
    ctx.save(); ctx.translate(W / 2, 700 + i * 200); ctx.scale(sc, sc);
    txt(s, 0, 0, 140, '#fff', { alpha: e * out, weight: 900 }); ctx.restore();
  });
  if (t > 3.1) {
    const e = easeOut((t - 3.1) / .5);
    txt('あるのは、', W / 2, 840, 110, '#fff', { alpha: e, weight: 900 });
    txt('数式だけ。', W / 2, 1010, 150, '#ffd86b', { alpha: easeOut((t - 3.35) / .4), weight: 900, glow: 'rgba(255,190,80,.8)', blur: 40 });
  }
}
function sceneCode(u, f, k) {
  ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H);
  const lines = (FS_LAND + FS_RAY).split('\n'), lh = 40, off = u * 520;
  ctx.save(); ctx.font = `500 26px ${MONO}`; ctx.textBaseline = 'middle';
  for (let y = -lh; y < H + lh; y += lh) {
    const idx = Math.floor((y + off) / lh), s = lines[((idx % lines.length) + lines.length) % lines.length];
    ctx.fillStyle = /^\s*(float|vec3|void|const|uniform)/.test(s) ? 'rgba(126,231,135,.75)' : 'rgba(150,180,255,.6)';
    ctx.fillText(s.slice(0, 68), 40, y - ((off % lh) + lh) % lh + lh);
  }
  ctx.restore();
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(5,7,13,.9)'); g.addColorStop(.25, 'rgba(5,7,13,.35)'); g.addColorStop(.75, 'rgba(5,7,13,.5)'); g.addColorStop(1, 'rgba(5,7,13,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 実際の音の波形
  const wv = A.wave[f]; ctx.save(); ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.shadowColor = '#ffb040'; ctx.shadowBlur = 24; ctx.beginPath();
  for (let i = 0; i < wv.length; i++) { const x = 60 + i / (wv.length - 1) * (W - 120), y = 1180 + wv[i] * 170; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.restore();
  const stats = [[TOTAL, 'フレーム'], [29.9, '億ピクセルを計算'], [A.notes, '個の音を合成']];
  stats.forEach(([n, label], i) => {
    const st = .15 + i * .5, e = easeOut((u - st) / .45), y = 480 + i * 190, val = n * e;
    const s = n % 1 ? val.toFixed(1) : Math.round(val).toLocaleString('en-US');
    txt(s, W / 2 - 20, y, 130, '#fff', { align: 'right', alpha: ease((u - st) / .2), weight: 900, glow: 'rgba(0,0,0,.9)', blur: 20 });
    txt(label, W / 2 + 10, y + 22, 46, '#cfd6ff', { align: 'left', alpha: ease((u - st) / .2), weight: 600, glow: 'rgba(0,0,0,.9)', blur: 12 });
  });
  txt('全部、この文字から生まれた。', W / 2, 1520, 66, '#fff', { alpha: ease((u - 2) / .4), weight: 900, glow: 'rgba(0,0,0,.95)', blur: 24 });
  txt('映像も音も、プログラムの計算結果', W / 2, 1610, 36, '#dfe5ff', { alpha: ease((u - 2.3) / .4), weight: 500 });
}
function sceneFinale(u, f, k) {
  space(k, 760);
  const sp = A.spec[f], NB = sp.length, R0 = 450 + k * 22;
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(u * .12); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 9; ctx.globalAlpha = ease((u - .6) / .8);
  for (let i = 0; i < NB * 4; i++) {
    const b = i % (NB * 2), v = sp[b < NB ? b : NB * 2 - 1 - b], a = i / (NB * 4) * 6.283, len = 8 + v * v * 140;
    ctx.strokeStyle = `hsla(${200 + v * 140},95%,62%,.9)`; ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R0, Math.sin(a) * R0); ctx.lineTo(Math.cos(a) * (R0 + len), Math.sin(a) * (R0 + len)); ctx.stroke();
  }
  ctx.restore();
  const settle = ease(u / 1.6), pulse = 1 + k * .0;
  drawCloud('sphere', 'text', u / 1.3, (1 - settle) * 1.8 + Math.sin(u * .9) * .2 * settle, .32 * (1 - settle) + Math.sin(u * .6) * .06, W / 2, 760, 25 + u * 22, 90);
  bloom(.9, 14);
  const stats = [['素材', '0点'], ['費用', '¥0'], ['使ったもの', 'コードだけ'], ['人が描いた絵', 'ゼロ']];
  stats.forEach(([a, b], i) => {
    const st = 1.5 + i * .5, al = ease((u - st) / .3), y = 1370 + i * 84, dx = (1 - easeOut((u - st) / .4)) * 60;
    txt(a, 150 - dx, y, 44, '#8e98c9', { align: 'left', alpha: al, weight: 500 });
    txt(b, W - 150 + dx, y, 48, '#fff', { align: 'right', alpha: al, weight: 800 });
    ctx.fillStyle = `rgba(120,130,200,${.25 * al})`; ctx.fillRect(150, y + 40, W - 300, 2);
  });
  txt('これが、Claude Code。', W / 2, 1765, 66, '#ffd86b', { alpha: ease((u - 4) / .4), weight: 900, glow: 'rgba(255,190,80,.7)', blur: 30 });
}
function hud(f) {
  const sp = A.spec[f];
  ctx.save(); ctx.globalAlpha = .75; ctx.fillStyle = '#fff';
  for (let i = 0; i < sp.length; i++) { const h = 4 + sp[i] * sp[i] * 34; ctx.fillRect(60 + i * 9, 1880 - h, 5, h); }
  ctx.restore();
  txt(`FRAME ${String(f + 1).padStart(4, '0')} / ${TOTAL}`, W - 60, 1866, 26, 'rgba(255,255,255,.75)', { align: 'right', font: MONO, weight: 500 });
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = '#ffd86b'; ctx.fillRect(0, H - 6, W * (f + 1) / TOTAL, 6);
}

window.renderFrame = function (f) {
  const t = f / FPS, k = A.k[f];
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t < 4) sceneIntro(t);
  else if (t < 12) { runShader(P_LAND, 720, 1280, t - 4); grain(f); caption('山も、海も、光も。', '地形・水面の反射・朝焼けを、数式だけで描く', t - 4, 8); }
  else if (t < 20) { sceneRay(t - 12); grain(f, .05); caption('反射、屈折、影。', '光の道すじを1本ずつ追う(レイトレーシング)', t - 12, 8); }
  else if (t < 28) { sceneFluid(f - 600, t - 20, k); caption('流れを、解く。', '流体の方程式を毎フレーム計算(ナビエ–ストークス)', t - 20, 8); }
  else if (t < 36) { sceneGalaxy(t - 28, k); caption('6万個の点を、3Dで。', '銀河 → DNA → 球体。座標はすべて計算', t - 28, 8, 88); }
  else if (t < 40) sceneCode(t - 36, f, k);
  else sceneFinale(t - 40, f, k);
  for (const ti of [4, 12, 20, 28, 36, 40]) if (t >= ti && t < ti + .5) { ctx.fillStyle = `rgba(255,255,255,${Math.exp(-(t - ti) * 9) * .9})`; ctx.fillRect(0, 0, W, H); }
  hud(f);
  if (t > 47.3) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - 47.3) / .6)})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
