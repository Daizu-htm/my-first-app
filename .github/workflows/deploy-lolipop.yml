name: Deploy to Lolipop

on:
  push:
    branches: [main, 'claude/**'] # Claudeがpushしたら自動公開
  workflow_dispatch: # GitHub Actionsタブ/スマホから手動実行も可

concurrency:
  group: deploy-lolipop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: テスト(package.jsonにtestがあれば実行)
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then npm ci && npm test; else echo "no tests"; fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ビルドが必要なプロジェクトはここで実行し、local-dir を出力先(例: ./dist/)に変える
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci && npm run build

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USER }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          # LOLIPOP_REMOTE_DIR = ドメインのルート(例: /fertilizer.jp/)。公開先はその下のサブパス。
          server-dir: ${{ secrets.LOLIPOP_REMOTE_DIR }}tool/clco/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
